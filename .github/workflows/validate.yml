name: validate

# Runs the private stalker-manager pipeline against this public mod.
# The pipeline code lives in the private stalker-dev repo, checked out here with a
# read-only deploy key (secret PIPELINE_SSH_KEY) onto an ephemeral runner. Nothing
# about the pipeline's internals is stored in or printed from this repo beyond the
# validator's own findings about this mod's code.

on:
  push:
  workflow_dispatch:

# Least privilege: the job only reads this repo. The private pipeline arrives via the deploy key,
# and the check is the run's own status -- no GITHUB_TOKEN writes are needed.
permissions:
  contents: read

# One validation per branch: a newer push cancels an in-flight run of the same ref.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout mod
        uses: actions/checkout@v4
        with:
          path: AlifePlus

      - name: Checkout xlibs dependency (sibling; public)
        uses: actions/checkout@v4
        with:
          repository: damiansirbu-stalker/xlibs
          path: xlibs

      - name: Checkout pipeline (private stalker-dev)
        uses: actions/checkout@v4
        with:
          repository: damiansirbu-stalker/stalker-dev
          ssh-key: ${{ secrets.PIPELINE_SSH_KEY }}
          path: pipeline
          # Only the validator tree -- keeps the rest of the private repo (other mods' tooling,
          # docs, the engine store) off the runner. With sparse-checkout set, checkout@v4 skips its
          # upfront `git lfs fetch` (which would pull EVERY LFS object on the ref, incl. the ~40
          # engine-variant binaries) and lazily smudges only in-cone LFS -- i.e. stalker-manager/bin/*.exe.
          sparse-checkout: stalker-manager
          lfs: true

      - name: Cache pipeline env
        uses: actions/cache@v4
        with:
          path: pipeline/stalker-manager/env
          key: mm-env-${{ hashFiles('pipeline/stalker-manager/requirements.txt') }}

      - name: Setup pipeline env
        shell: bash
        run: |
          if [ ! -d pipeline/stalker-manager/env/stalker-manager ]; then
            bash pipeline/stalker-manager/stalker-manager.sh setup
          fi

      - name: Point pipeline at this checkout
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE//\\//}"
          {
            echo "repo_path: \"$ws\""
            echo "mods_path: \"$ws\""
            echo "dev_mods:"
            echo "  - name: \"AlifePlus\""
            echo "    repo: \"$ws/AlifePlus\""
          } > pipeline/stalker-manager/dev.yaml
          cat pipeline/stalker-manager/dev.yaml

      - name: Validate
        shell: bash
        run: |
          bash pipeline/stalker-manager/stalker-manager.sh validate-dev-mods AlifePlus --emit out
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
